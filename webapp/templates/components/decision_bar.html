<div class="decision-bar card">
  <form method="post" action="/analyze" class="decision-form">
    <input type="hidden" name="case_id" value="{{ case_id }}" />
    <input type="hidden" name="stage" value="{{ stage }}" />
    <button type="submit" name="decision" value="decline" class="secondary-btn">Decline and Upload New Image</button>
    <button type="submit" name="decision" value="accept" class="primary-btn">{{ accept_label }}</button>
  </form>
</div>
